{% extends "base.html" %}
{% block title %}Confirm deletion &middot; Portfolio Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Delete {{ object_label }}?</h1>
        <p class="text-muted">{{ warning }}</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            {% if cancel_pk %}
              <a class="btn btn-outline-secondary" href="{% url cancel_url cancel_pk %}">Cancel</a>
            {% else %}
              <a class="btn btn-outline-secondary" href="{% url cancel_url %}">Cancel</a>
            {% endif %}
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
