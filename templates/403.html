{% extends "base.html" %}
{% block title %}Access denied{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-4">403</h1>
  <p class="lead">You don't have permission to view or change this page.</p>
  {% if user.is_authenticated %}
    <a class="btn btn-primary" href="{% url 'portfolio:dashboard' %}">Go to my portfolio</a>
  {% else %}
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in</a>
  {% endif %}
</div>
{% endblock %}
